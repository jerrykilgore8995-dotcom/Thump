name: THUMP Windows VST3
on:
  workflow_dispatch:
  push:
    branches: [main, thump-development]
    paths:
      - 'Source/**'
      - 'CMakeLists.txt'
      - '.github/workflows/windows-vst3.yml'
      - 'tests/**'
jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout THUMP
        uses: actions/checkout@v4
      - name: Run DSP consistency checks
        run: python tests/validate_dsp.py
      - name: Validate EQ curve-family maths
        run: python tests/test_eq_curves.py
      - name: Test saturation and front-panel geometry
        run: python tests/test_drive_and_gui.py
      - name: Configure VS2022 x64 + JUCE 8
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build VST3 Release
        run: cmake --build build --config Release --target Thump_VST3 --parallel 4
      - name: Package VST3
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Recurse -Directory -Filter 'THUMP.vst3' | Select-Object -First 1
          if (-not $plugin) { throw 'THUMP.vst3 bundle not found' }
          Compress-Archive -LiteralPath $plugin.FullName -DestinationPath THUMP_0.3.0_Windows_x64_VST3.zip -Force
      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: THUMP-Windows-x64-VST3
          path: THUMP_0.3.0_Windows_x64_VST3.zip
