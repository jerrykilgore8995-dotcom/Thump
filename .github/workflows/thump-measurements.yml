name: THUMP v0.5 VST3 Measurement Lab
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tests/measure_thump.py'
      - '.github/workflows/thump-measurements.yml'
permissions:
  contents: write
jobs:
  measure:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Compile unmodified Windows VST3
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          cmake --build build --config Release --target Thump_VST3 --parallel 4
      - name: Install analysis dependencies
        run: python -m pip install pedalboard numpy scipy
      - name: Run actual VST3 FFT and harmonic analysis
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Recurse -Directory -Filter 'THUMP.vst3' | Select-Object -First 1
          if (-not $plugin) { throw 'THUMP.vst3 plugin not found' }
          python tests/measure_thump.py $plugin.FullName
          if ($LASTEXITCODE -ne 0) { throw "Measurement failed: $LASTEXITCODE" }
      - uses: actions/upload-artifact@v4
        with:
          name: THUMP-v05-Measurement-Data
          path: measurements/v0.5/
      - name: Publish measurements to repository
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add measurements/v0.5/
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'Save actual THUMP v0.5 VST3 analysis CSV'
            git push
          }